version: 2

models:
  - name: stg_crypto
    description: "Cleaned and staged crypto data from CoinMarketCap"
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null
      - name: market_cap_usd
        tests:
          - not_null
      - name: price_trend
        tests:
          - not_null
          - accepted_values:
              values:
                - gaining
                - losing
                - stable